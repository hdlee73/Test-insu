# 태그(v*)를 푸시하면 서명된 Release APK를 만들어 GitHub Releases에 올린다.
# 서명 키는 저장소에 없고 GitHub Secrets로만 받는다:
#   INSU_KEYSTORE_BASE64, INSU_KEYSTORE_PASSWORD, INSU_KEY_ALIAS, INSU_KEY_PASSWORD
name: Release

on:
  push:
    tags: [ "v*" ]
  workflow_dispatch:
    inputs:
      tag:
        description: "릴리스할 기존 태그 (예: v0.1.0)"
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Check signing secrets
        env:
          KS: ${{ secrets.INSU_KEYSTORE_BASE64 }}
          KSP: ${{ secrets.INSU_KEYSTORE_PASSWORD }}
          KA: ${{ secrets.INSU_KEY_ALIAS }}
          KP: ${{ secrets.INSU_KEY_PASSWORD }}
        run: |
          missing=""
          [ -z "$KS" ] && missing="$missing INSU_KEYSTORE_BASE64"
          [ -z "$KSP" ] && missing="$missing INSU_KEYSTORE_PASSWORD"
          [ -z "$KA" ] && missing="$missing INSU_KEY_ALIAS"
          [ -z "$KP" ] && missing="$missing INSU_KEY_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::GitHub Secrets가 등록되지 않았습니다:$missing (README의 '릴리스' 절 참고)"
            exit 1
          fi

      - name: Check tag matches versionName
        run: |
          version=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts | head -1)
          if [ "v$version" != "$TAG" ]; then
            echo "::error::태그($TAG)와 app/build.gradle.kts의 versionName(v$version)이 다릅니다"
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4

      - name: Restore keystore
        env:
          KS: ${{ secrets.INSU_KEYSTORE_BASE64 }}
        run: |
          echo "$KS" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "INSU_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Test and build signed release APK
        env:
          INSU_KEYSTORE_PASSWORD: ${{ secrets.INSU_KEYSTORE_PASSWORD }}
          INSU_KEY_ALIAS: ${{ secrets.INSU_KEY_ALIAS }}
          INSU_KEY_PASSWORD: ${{ secrets.INSU_KEY_PASSWORD }}
        run: ./gradlew --no-daemon testReleaseUnitTest assembleRelease

      - name: Verify signature and rename
        run: |
          apk=app/build/outputs/apk/release/app-release.apk
          if [ ! -f "$apk" ]; then
            echo "::error::서명된 APK가 없습니다 (서명 설정 확인)"
            ls -R app/build/outputs/apk
            exit 1
          fi
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner"
          "$apksigner" verify --verbose "$apk"
          mkdir -p dist
          cp "$apk" "dist/InsuNote-$TAG.apk"
          (cd dist && sha256sum "InsuNote-$TAG.apk" > "InsuNote-$TAG.apk.sha256")

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: 증권노트 ${{ env.TAG }}
          generate_release_notes: true
          body: |
            보험증권(PDF·사진·스캔)에서 계약자·피보험자·가입금액·보험료·계약기간을 추출해 휴대폰에 암호화 저장하고 docx·xlsx로 내보내는 앱입니다.

            **설치**: 아래 `InsuNote-${{ env.TAG }}.apk`를 휴대폰에서 내려받아 설치하세요. 처음이면 '출처를 알 수 없는 앱 설치'를 허용해야 합니다. 이후 새 버전은 앱의 '정보·사용 방법' 화면에서 확인할 수 있습니다.
          files: |
            dist/InsuNote-${{ env.TAG }}.apk
            dist/InsuNote-${{ env.TAG }}.apk.sha256
